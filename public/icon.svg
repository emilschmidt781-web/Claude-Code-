    <path d="M120 -70 L60 -140 L30 -60 Z" fill="#f79a4d"/>
    <path d="M-96 -78 L-64 -118 L-46 -70 Z" fill="#ffd9b0"/>
    <path d="M96 -78 L64 -118 L46 -70 Z" fill="#ffd9b0"/>
