<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#2f2a3a;color:#f6f1ec;font-family:'DM Sans';position:relative}
.orb{position:absolute;left:50%;top:50%;width:620px;height:620px;margin:-330px 0 0 -310px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#ffd9e6 0%,#f4b6cf 25%,#b9a3f0 55%,#7d8de0 80%,#4b4a8a 100%);
 box-shadow:0 0 120px 40px rgba(185,163,240,.35), inset -30px -40px 80px rgba(47,42,58,.35)}
.ring{position:absolute;left:50%;top:50%;border:1px solid rgba(246,241,236,.18);border-radius:50%}
.inner{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);text-align:center;color:#2f2a3a}
.inner small{display:block;font-size:13px;letter-spacing:.35em;text-transform:uppercase;margin-bottom:16px}
.inner h1{font-family:Fraunces;font-weight:300;font-size:110px;line-height:.9;letter-spacing:-.04em}
.inner h1 i{display:block;font-size:64px;margin-top:10px}
.inner p{margin-top:22px;font-size:16px}
.logo{position:absolute;top:44px;left:56px;font-family:Fraunces;font-style:italic;font-size:34px}
.time{position:absolute;top:50px;right:56px;font-size:14px;text-align:right;line-height:1.6;color:#cfc6dc}
.vert{position:absolute;left:56px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#a99fbd}
.dock{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:999px;background:rgba(246,241,236,.1);backdrop-filter:blur(10px);border:1px solid rgba(246,241,236,.15);font-size:14px}
.dock span{padding:11px 22px;border-radius:999px}.dock .on{background:#f6f1ec;color:#2f2a3a}
.steps{position:absolute;right:56px;bottom:46px;font-family:Fraunces;font-style:italic;font-size:20px;color:#cfc6dc}
</style><style id="motion">
/* Animationen */
@keyframes breathe{0%,100%{transform:scale(.94);box-shadow:0 0 90px 20px rgba(185,163,240,.25),inset -30px -40px 80px rgba(47,42,58,.35)}45%,55%{transform:scale(1.04);box-shadow:0 0 160px 60px rgba(244,182,207,.4),inset -30px -40px 80px rgba(47,42,58,.25)}}
@keyframes ripple{0%{transform:scale(.9);opacity:0}30%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes orbIn{from{opacity:0;transform:scale(.6);filter:blur(30px)}to{opacity:1;transform:scale(.94);filter:none}}
@keyframes up{from{opacity:0;transform:translate(-50%,-50%) translateY(20px)}to{opacity:1;transform:translate(-50%,-56%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes float{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(14px,-26px);opacity:.8}}
@keyframes say{0%,100%{color:#a99fbd;text-shadow:none}6%,30%{color:#fff;text-shadow:0 0 18px rgba(244,182,207,.8)}36%{color:#a99fbd;text-shadow:none}}
.orb{animation:orbIn 2s cubic-bezier(.22,1,.36,1) both,breathe 8s ease-in-out 2s infinite}
.ring{animation:ripple 8s ease-out infinite}
.ring:nth-of-type(2){animation-delay:4s}
.inner{animation:up 1.6s cubic-bezier(.22,1,.36,1) .8s both}
.inner h1 i{display:block;animation:fade 1.4s ease 1.6s both}
.logo,.time,.vert{animation:fade 1.2s ease 1.2s both}
.dock{animation:dockIn 1.2s cubic-bezier(.22,1,.36,1) 1.4s both}
.dock span{transition:background .4s,color .4s}
.dock span:hover{background:rgba(246,241,236,.18)}
.steps{animation:fade 1s ease 2s both}
.steps span{animation:say 8s ease-in-out 2s infinite}
.steps span:nth-child(2){animation-delay:4.4s}
.steps span:nth-child(3){animation-delay:6.6s}
.pt{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#f4b6cf;filter:blur(1px);animation:float 9s ease-in-out var(--d) infinite;pointer-events:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<!-- Demo-Rahmen: skaliert die 1280×800-Startseite auf jedes Fenster und kennzeichnet sie als Konzept -->
<style>
.demo-frame{position:absolute;left:50%;top:calc(50% - 30px);width:1280px;height:800px;transform-origin:50% 50%;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.demo-badge{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:999px;background:#1f1f22;color:#fff;font:600 13px/1.2 Inter,system-ui,sans-serif;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);white-space:nowrap}
.demo-badge a{color:#1f1f22;background:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:800}.demo-badge small{display:flex;gap:4px;align-items:center;font-weight:500;opacity:.8}.demo-badge small a{background:none;color:#fff;padding:0;font-weight:500;text-decoration:underline}
</style>
<script>
(function () {
  var frame = document.createElement("div");
  frame.className = "demo-frame";
  while (document.body.firstChild) frame.appendChild(document.body.firstChild);
  document.body.appendChild(frame);
  document.body.style.width = "100vw";
  document.body.style.height = "100vh";
  var badge = document.createElement("div");
  badge.className = "demo-badge";
  badge.innerHTML = 'Design-Konzept von Brandner Studios <a href="../index.html#konzepte">Zurück</a><small><a href="../impressum.html">Impressum</a> · <a href="../datenschutz.html">Datenschutz</a></small>';
  document.body.appendChild(badge);
  function fit() {
    var s = Math.min(innerWidth / 1280, (innerHeight - 60) / 800);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  addEventListener("resize", fit);
  fit();
})();
</script>
</body></html>
