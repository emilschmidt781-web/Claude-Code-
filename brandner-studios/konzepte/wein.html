<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Weingut Rebenhang – Design-Konzept</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#3b0d1a;color:#f3e6d0;font-family:Inter;position:relative}
nav{position:absolute;top:36px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#d8b77a}
nav .logo{font-family:'Playfair Display';font-style:italic;font-size:26px;letter-spacing:0;text-transform:none;color:#f3e6d0}
nav ul{display:flex;gap:40px;list-style:none;padding:0}
nav ul li span{color:#8e6a45;margin-right:6px}
.line{position:absolute;background:#8e6a45;opacity:.6}
h1{position:absolute;left:60px;top:170px;font-family:'Playfair Display';font-weight:400;font-size:168px;line-height:.86;letter-spacing:-.03em}
h1 i{color:#d8b77a;font-weight:400}
h1 .ind{padding-left:190px}
.vert{position:absolute;left:24px;bottom:60px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:#8e6a45}
.side{position:absolute;right:60px;top:210px;width:300px;font-size:14px;line-height:1.8;color:#d9c7a8;font-weight:300}
.side b{display:block;font-family:'Playfair Display';font-style:italic;font-weight:400;font-size:30px;line-height:1.1;color:#f3e6d0;margin-bottom:18px}
.btn{display:inline-block;margin-top:26px;padding:16px 30px;border:1px solid #d8b77a;color:#d8b77a;font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.grapes{position:absolute;right:250px;bottom:-40px}
.grapes circle{fill:url(#gg)}
.num{position:absolute;right:60px;bottom:50px;font-family:'Playfair Display';font-style:italic;font-size:110px;color:transparent;-webkit-text-stroke:1px #8e6a45}
.year{position:absolute;left:60px;bottom:56px;font-size:12px;letter-spacing:.3em;color:#d8b77a;text-transform:uppercase}
</style></head><body>
<nav><span class="logo">Rebenhang</span><ul><li><span>I</span>Weine</li><li><span>II</span>Lage</li><li><span>III</span>Besuch</li></ul><span>Shop →</span></nav>
<div class="line" style="left:60px;right:60px;top:92px;height:1px"></div>
<div class="line" style="left:820px;top:92px;bottom:0;width:1px"></div>
<h1>Wein,<br><span class="ind"><i>langsam</i></span><br>gewachsen.</h1>
<div class="side"><b>Silvaner vom Steilhang, seit drei Generationen.</b>Handgelesen am Main. Ausgebaut im Gewölbekeller, getrunken unter freiem Himmel.<br><span class="btn">Weine entdecken</span></div>
<svg class="grapes" width="260" height="330" viewBox="0 0 260 330"><defs><radialGradient id="gg" cx=".35" cy=".3"><stop offset="0" stop-color="#a8304f"/><stop offset="1" stop-color="#5a0f24"/></radialGradient></defs>
<path d="M130 10 C130 40 150 50 150 70" stroke="#8e6a45" stroke-width="3" fill="none"/><path d="M150 40 C190 20 230 40 240 70 C200 80 170 70 150 40Z" fill="#6b7a3a" opacity=".85"/>
<g>
<circle cx="90" cy="100" r="32"/><circle cx="150" cy="96" r="32"/><circle cx="210" cy="104" r="30"/>
<circle cx="60" cy="155" r="30"/><circle cx="120" cy="152" r="32"/><circle cx="182" cy="150" r="32"/>
<circle cx="90" cy="208" r="31"/><circle cx="152" cy="206" r="32"/><circle cx="120" cy="260" r="30"/><circle cx="180" cy="256" r="28"/><circle cx="148" cy="306" r="26"/></g></svg>
<div class="num">№ 7</div>
<div class="vert">Weingut am Main · Franken</div>
<div class="year">Lese 2025 — ab sofort</div>

<!-- Demo-Rahmen: skaliert die 1280×800-Startseite auf jedes Fenster und kennzeichnet sie als Konzept -->
<style>
.demo-frame{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:50% 50%}
.demo-badge{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:999px;background:#1f1f22;color:#fff;font:600 13px/1.2 Inter,system-ui,sans-serif;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);white-space:nowrap}
.demo-badge a{color:#1f1f22;background:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:800}
</style>
<script>
(function () {
  var frame = document.createElement("div");
  frame.className = "demo-frame";
  while (document.body.firstChild) frame.appendChild(document.body.firstChild);
  document.body.appendChild(frame);
  document.body.style.width = "100vw";
  document.body.style.height = "100vh";
  var badge = document.createElement("div");
  badge.className = "demo-badge";
  badge.innerHTML = 'Design-Konzept von Brandner Studios <a href="../index.html#konzepte">Zurück</a>';
  document.body.appendChild(badge);
  function fit() {
    var s = Math.min(innerWidth / 1280, innerHeight / 800);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  addEventListener("resize", fit);
  fit();
})();
</script>
</body></html>
