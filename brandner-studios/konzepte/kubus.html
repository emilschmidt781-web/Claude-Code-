<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Kubus Architektur – Design-Konzept</title>
<style>

  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#f4f2ee;color:#161616;font-family:Archivo;position:relative}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);padding:0 32px;column-gap:16px;pointer-events:none}
.cols i{border-left:1px solid #1616160f;border-right:1px solid #1616160f}
.meta{position:absolute;top:28px;left:32px;right:32px;display:grid;grid-template-columns:repeat(12,1fr);column-gap:16px;font-size:12px;line-height:1.4}
.meta b{font-weight:900;font-size:13px;letter-spacing:.02em}
.scene{position:absolute;left:300px;top:110px;width:700px;height:560px}
.title{position:absolute;left:32px;bottom:34px;font-weight:900;font-size:150px;line-height:.8;letter-spacing:-.06em}
.title sup{font-size:28px;letter-spacing:0;vertical-align:top;margin-left:10px;font-weight:600}
.idx{position:absolute;right:32px;bottom:40px;width:300px;font-size:12px}
.idx div{display:grid;grid-template-columns:30px 1fr auto;padding:8px 0;border-top:1px solid #161616}
.idx div:last-child{border-bottom:1px solid #161616}
.idx .on{color:#e63b2e;font-weight:600}
.note{position:absolute;left:32px;top:140px;width:220px;font-size:15px;line-height:1.45}
.note span{display:inline-block;margin-top:16px;padding:9px 14px;background:#161616;color:#f4f2ee;font-size:12px;font-weight:600}
</style><style id="motion">
/* Animationen */
@keyframes colIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes floor{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-90px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translate(120px,-56px)}to{opacity:1;transform:none}}
@keyframes hover{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@keyframes sun{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(242,194,24,0))}50%{filter:drop-shadow(0 0 18px rgba(242,194,24,.7))}}
@keyframes win{0%,100%{fill:#9fd0ff}50%{fill:#d6ecff}}
.cols i{transform-origin:top;animation:colIn 1.2s cubic-bezier(.22,1,.36,1) both}
.cols i:nth-child(2n){animation-delay:.08s}.cols i:nth-child(3n){animation-delay:.16s}
.meta{animation:fade 1s ease .5s both}
.note{animation:up 1s cubic-bezier(.22,1,.36,1) 1.6s both}
.note span{transition:background .3s,transform .3s cubic-bezier(.22,1,.36,1)}
.note span:hover{background:#e63b2e;transform:translateX(4px)}
.title{animation:up 1.2s cubic-bezier(.22,1,.36,1) 1.2s both}
.idx div{animation:up .8s cubic-bezier(.22,1,.36,1) both;transition:padding .4s cubic-bezier(.22,1,.36,1),color .3s}
.idx div:nth-child(1){animation-delay:1.8s}.idx div:nth-child(2){animation-delay:1.9s}.idx div:nth-child(3){animation-delay:2s}
.idx div:hover{padding-left:10px;color:#e63b2e}
.scene .floor{transform-box:fill-box;transform-origin:center;animation:floor 1s cubic-bezier(.22,1,.36,1) .3s both}
.scene .low{animation:dropIn 1s cubic-bezier(.34,1.3,.64,1) .7s both}
.scene .high{animation:slideIn 1.1s cubic-bezier(.22,1,.36,1) 1.1s both,hover 6s ease-in-out 2.4s infinite}
.scene .win{animation:fade .6s ease 1.8s both,win 5s ease-in-out 2.4s infinite}
.scene .acc{animation:fade .6s ease 2s both}
.scene .sun{animation:sun 1.4s cubic-bezier(.22,1,.36,1) .4s both,glow 5s ease-in-out 2s infinite}
.scene text{animation:fade 1s ease 2.2s both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head><body>

<!-- Demo-Rahmen: skaliert die 1280×800-Startseite auf jedes Fenster und kennzeichnet sie als Konzept -->
<style>
.demo-frame{position:absolute;left:50%;top:calc(50% - 30px);width:1280px;height:800px;transform-origin:50% 50%;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.demo-badge{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:999px;background:#1f1f22;color:#fff;font:600 13px/1.2 Inter,system-ui,sans-serif;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);white-space:nowrap}
.demo-badge a{color:#1f1f22;background:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:800}.demo-badge small{display:flex;gap:4px;align-items:center;font-weight:500;opacity:.8}.demo-badge small a{background:none;color:#fff;padding:0;font-weight:500;text-decoration:underline}
</style>
<script>
(function () {
  var frame = document.createElement("div");
  frame.className = "demo-frame";
  while (document.body.firstChild) frame.appendChild(document.body.firstChild);
  document.body.appendChild(frame);
  document.body.style.width = "100vw";
  document.body.style.height = "100vh";
  var badge = document.createElement("div");
  badge.className = "demo-badge";
  badge.innerHTML = 'Design-Konzept von Brandner Studios <a href="../index.html#konzepte">Zurück</a><small><a href="../impressum.html">Impressum</a> · <a href="../datenschutz.html">Datenschutz</a></small>';
  document.body.appendChild(badge);
  function fit() {
    var s = Math.min(innerWidth / 1280, (innerHeight - 60) / 800);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  addEventListener("resize", fit);
  fit();
})();
</script>
</body></html>
