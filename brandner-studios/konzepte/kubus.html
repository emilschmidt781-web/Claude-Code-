<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Kubus Architektur – Design-Konzept</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#efe9dc;color:#161616;font-family:'Space Grotesk';position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#16161612 1px,transparent 1px),linear-gradient(90deg,#16161612 1px,transparent 1px);background-size:80px 80px}
nav{position:absolute;top:32px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
nav .logo{font-family:'Archivo Black';font-size:26px;display:flex;align-items:center;gap:10px}
nav .logo i{width:26px;height:26px;background:#e63b2e}
nav ul{display:flex;gap:34px;list-style:none;padding:0}
.comp{position:absolute;right:40px;top:110px;width:600px;height:600px}
h1{position:absolute;left:40px;top:180px;font-family:'Archivo Black';font-size:118px;line-height:.9;text-transform:uppercase;letter-spacing:-.02em}
h1 span{display:block}
h1 .b{color:#1f4bd8}
p{position:absolute;left:44px;top:560px;width:420px;font-size:18px;line-height:1.5}
.btn{position:absolute;left:44px;bottom:60px;display:flex;align-items:center;gap:14px;font-family:'Archivo Black';text-transform:uppercase;font-size:15px}
.btn i{width:48px;height:48px;border-radius:50%;background:#161616;color:#efe9dc;display:grid;place-items:center;font-style:normal}
.idx{position:absolute;right:40px;bottom:30px;font-size:13px}
</style></head><body>
<div class="grid"></div>
<nav><span class="logo"><i></i>KUBUS</span><ul><li>Projekte</li><li>Büro</li><li>Haltung</li><li>Kontakt</li></ul></nav>
<h1><span>Raum</span><span class="b">folgt</span><span>Form.</span></h1>
<p>Architektur für Wohnen und Arbeiten — klar, ehrlich, mit Liebe zum Detail gebaut.</p>
<span class="btn"><i>→</i>Projekte ansehen</span>
<svg class="comp" viewBox="0 0 600 600">
<rect x="80" y="80" width="320" height="320" fill="#1f4bd8"/>
<circle cx="400" cy="240" r="160" fill="#f2c218" style="mix-blend-mode:multiply"/>
<path d="M240 560 A160 160 0 0 1 560 560Z" fill="#e63b2e"/>
<rect x="400" y="400" width="80" height="80" fill="#161616"/>
<line x1="40" y1="480" x2="560" y2="40" stroke="#161616" stroke-width="6"/>
<circle cx="140" cy="480" r="36" fill="none" stroke="#161616" stroke-width="6"/>
</svg>
<span class="idx">01 / 12 — Haus am Hang, 2025</span>

<!-- Demo-Rahmen: skaliert die 1280×800-Startseite auf jedes Fenster und kennzeichnet sie als Konzept -->
<style>
.demo-frame{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:50% 50%}
.demo-badge{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:999px;background:#1f1f22;color:#fff;font:600 13px/1.2 Inter,system-ui,sans-serif;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);white-space:nowrap}
.demo-badge a{color:#1f1f22;background:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:800}
</style>
<script>
(function () {
  var frame = document.createElement("div");
  frame.className = "demo-frame";
  while (document.body.firstChild) frame.appendChild(document.body.firstChild);
  document.body.appendChild(frame);
  document.body.style.width = "100vw";
  document.body.style.height = "100vh";
  var badge = document.createElement("div");
  badge.className = "demo-badge";
  badge.innerHTML = 'Design-Konzept von Brandner Studios <a href="../index.html#konzepte">Zurück</a>';
  document.body.appendChild(badge);
  function fit() {
    var s = Math.min(innerWidth / 1280, innerHeight / 800);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  addEventListener("resize", fit);
  fit();
})();
</script>
</body></html>
