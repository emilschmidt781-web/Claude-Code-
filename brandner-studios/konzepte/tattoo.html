<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#0b0b0d;color:#f1f1f1;font-family:Unbounded;position:relative}
.left{position:absolute;left:0;top:0;bottom:0;width:560px;background:#0b0b0d;overflow:hidden}
.left .dots{position:absolute;inset:0;background:radial-gradient(circle,#ff2e88 1.5px,transparent 2.1px) 0 0/11px 11px;-webkit-mask:linear-gradient(180deg,transparent 30%,#000);mask:linear-gradient(180deg,transparent 30%,#000);opacity:.8}
.logo{position:absolute;left:40px;top:34px;font-family:'Pirata One';font-size:40px}
.stack{position:absolute;left:34px;top:120px;font-family:'Rubik Mono One';font-size:84px;line-height:.95;text-transform:uppercase}
.stack span{display:block}.stack .p{color:#ff2e88}.stack .o{color:transparent;-webkit-text-stroke:2px #39ff88}
.lp{position:absolute;left:40px;bottom:120px;width:420px;font-size:13px;font-weight:300;line-height:1.7}
.cta{position:absolute;left:40px;bottom:40px;padding:18px 28px;background:#39ff88;color:#0b0b0d;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.right{position:absolute;left:560px;right:0;top:0;bottom:0;background:#f1ece2;color:#0b0b0d;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:60px repeat(2,1fr)}
.rnav{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;padding:0 30px;border-bottom:2px solid #0b0b0d;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.flash{border-right:2px solid #0b0b0d;border-bottom:2px solid #0b0b0d;position:relative;display:grid;place-items:center}
.flash:nth-child(3n+1){border-right:0}
.flash small{position:absolute;left:12px;bottom:10px;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
.flash i{position:absolute;right:12px;top:10px;font-style:normal;font-size:10px;font-weight:700;color:#ff2e88}
.flash svg{width:120px;height:120px;fill:none;stroke:#0b0b0d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><style id="motion">
/* Animationen */
@keyframes flicker{0%{opacity:0}8%{opacity:1}10%{opacity:.2}14%{opacity:1}18%{opacity:.4}22%,100%{opacity:1}}
@keyframes glow{0%,100%{text-shadow:0 0 8px rgba(255,46,136,.5),0 0 24px rgba(255,46,136,.3)}50%{text-shadow:0 0 14px rgba(255,46,136,.9),0 0 44px rgba(255,46,136,.6)}}
@keyframes glowG{0%,100%{filter:drop-shadow(0 0 4px rgba(57,255,136,.4))}50%{filter:drop-shadow(0 0 12px rgba(57,255,136,.9))}}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes cell{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes dots{to{background-position:11px 11px}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(900px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(57,255,136,.6)}70%{box-shadow:0 0 0 18px rgba(57,255,136,0)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stack span{animation:flicker 1.2s steps(1) both}
.stack span:nth-child(1){animation-delay:.3s}
.stack .p{animation:flicker 1.2s steps(1) .7s both,glow 3s ease-in-out 2s infinite}
.stack .o{animation:flicker 1.2s steps(1) 1.1s both,glowG 3s ease-in-out 2.5s infinite}
.logo{animation:up .8s cubic-bezier(.22,1,.36,1) .1s both}
.lp{animation:up 1s cubic-bezier(.22,1,.36,1) 1.6s both}
.cta{animation:up 1s cubic-bezier(.22,1,.36,1) 1.8s both,pulse 2.4s ease-out 3s infinite}
.left .dots{animation:dots 6s linear infinite}
.left::after{content:"";position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(180deg,transparent,rgba(255,46,136,.08),transparent);animation:scan 6s linear 2s infinite;pointer-events:none}
.flash{animation:cell .6s cubic-bezier(.22,1,.36,1) both;transition:background .3s}
.flash:nth-of-type(2){animation-delay:.5s}.flash:nth-of-type(3){animation-delay:.65s}.flash:nth-of-type(4){animation-delay:.8s}
.flash:nth-of-type(5){animation-delay:.95s}.flash:nth-of-type(6){animation-delay:1.1s}.flash:nth-of-type(7){animation-delay:1.25s}
.flash svg *{stroke-dasharray:420;stroke-dashoffset:420;animation:ink 2.2s ease-out forwards}
.flash:nth-of-type(2) svg *{animation-delay:.6s}.flash:nth-of-type(3) svg *{animation-delay:.8s}.flash:nth-of-type(4) svg *{animation-delay:1s}
.flash:nth-of-type(5) svg *{animation-delay:1.2s}.flash:nth-of-type(6) svg *{animation-delay:1.4s}.flash:nth-of-type(7) svg *{animation-delay:1.6s}
.flash svg{transition:transform .5s cubic-bezier(.22,1,.36,1)}
.flash:hover{background:#fff}
.flash:hover svg{transform:scale(1.15) rotate(-6deg)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<!-- Demo-Rahmen: skaliert die 1280×800-Startseite auf jedes Fenster und kennzeichnet sie als Konzept -->
<style>
.demo-frame{position:absolute;left:50%;top:calc(50% - 30px);width:1280px;height:800px;transform-origin:50% 50%;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.demo-badge{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:999px;background:#1f1f22;color:#fff;font:600 13px/1.2 Inter,system-ui,sans-serif;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);white-space:nowrap}
.demo-badge a{color:#1f1f22;background:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:800}.demo-badge small{display:flex;gap:4px;align-items:center;font-weight:500;opacity:.8}.demo-badge small a{background:none;color:#fff;padding:0;font-weight:500;text-decoration:underline}
</style>
<script>
(function () {
  var frame = document.createElement("div");
  frame.className = "demo-frame";
  while (document.body.firstChild) frame.appendChild(document.body.firstChild);
  document.body.appendChild(frame);
  document.body.style.width = "100vw";
  document.body.style.height = "100vh";
  var badge = document.createElement("div");
  badge.className = "demo-badge";
  badge.innerHTML = 'Design-Konzept von Brandner Studios <a href="../index.html#konzepte">Zurück</a><small><a href="../impressum.html">Impressum</a> · <a href="../datenschutz.html">Datenschutz</a></small>';
  document.body.appendChild(badge);
  function fit() {
    var s = Math.min(innerWidth / 1280, (innerHeight - 60) / 800);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  addEventListener("resize", fit);
  fit();
})();
</script>
