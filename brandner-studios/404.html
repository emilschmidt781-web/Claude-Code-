<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Seite nicht gefunden – Brandner Studios</title>
    <!-- Wird vom Hoster für unbekannte Adressen ausgeliefert, daher Pfade ab der Domain-Wurzel -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/img/logo-icon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Instrument Serif";
        font-display: swap;
        src: url(/fonts/InstrumentSerif-normal-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        font-display: swap;
        src: url(/fonts/InstrumentSerif-italic-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/Inter-normal-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/JetBrainsMono-normal-400.woff2) format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0f;
        color: #f2f1f6;
        font: 17px/1.6 Inter, system-ui, sans-serif;
        text-align: center;
        overflow: hidden;
      }
      .bg {
        position: fixed;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 20%, transparent 75%);
        mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 20%, transparent 75%);
        animation: drift 24s linear infinite;
      }
      @keyframes drift {
        to {
          background-position: 64px 64px;
        }
      }
      main {
        position: relative;
      }
      .code {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(8rem, 30vw, 16rem);
        line-height: 0.9;
        letter-spacing: -0.05em;
        background: linear-gradient(90deg, #ff5fa8, #b69cff, #5fb0ec);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin: 10px 0 12px;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        line-height: 1;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 auto 30px;
        max-width: 38ch;
        color: #9b99aa;
      }
      .term {
        margin: 0 auto 30px;
        max-width: 420px;
        padding: 14px 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #101018;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.9rem;
        text-align: left;
      }
      .term span {
        display: block;
      }
      .term .c {
        color: #ff5fa8;
      }
      .term .e {
        color: #ff6b6b;
      }
      .term .o {
        color: #5fb0ec;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      a {
        display: inline-flex;
        align-items: center;
        padding: 14px 26px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #f2f1f6;
        font-weight: 600;
        text-decoration: none;
      }
      a.primary {
        background: #ff5fa8;
        border-color: #ff5fa8;
        color: #0a0a0f;
      }
      a:hover {
        border-color: #f2f1f6;
      }
      @media (prefers-reduced-motion: reduce) {
        .bg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Diese Seite gibt es nicht.</h1>
      <p>Vielleicht ein Tippfehler in der Adresse – oder die Seite ist umgezogen.</p>
      <div class="term" aria-hidden="true">
        <span class="c">$ brandner open diese-seite</span>
        <span class="e">✗ nicht gefunden</span>
        <span class="o">▸ vorschlag: zur startseite</span>
      </div>
      <div class="btns">
        <a class="primary" href="/">Zur Startseite</a>
        <a href="/#kontakt">Kontakt</a>
      </div>
    </main>
  </body>
</html>
