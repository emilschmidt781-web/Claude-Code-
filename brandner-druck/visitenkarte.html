<style>
  /* Druckformat: 85 × 55 mm Endformat, rundum 3 mm Beschnitt = 91 × 61 mm */
  @font-face { font-family: "Archivo Wide"; font-weight: 800; src: url(../brandner-studios/fonts/ArchivoWide-800.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url(../brandner-studios/fonts/Inter-normal-400.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 100 900; src: url(../brandner-studios/fonts/JetBrainsMono-normal-400.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(../brandner-studios/fonts/InstrumentSerif-italic-400.woff2) format("woff2"); }
  @page { size: 91mm 61mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card {
    position: relative;
    width: 91mm;
    height: 61mm;
    overflow: hidden;
    background: #0a0a0f;
    color: #f2f1f6;
    font-family: Inter, sans-serif;
    page-break-after: always;
  }
  /* feines Raster wie auf der Website */
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.06) .2mm, transparent .2mm), linear-gradient(90deg, rgba(255,255,255,.06) .2mm, transparent .2mm);
    background-size: 6mm 6mm;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, #000 20%, transparent 80%);
    mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, #000 20%, transparent 80%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(9mm); opacity: .55; }
  /* Sicherheitsabstand: Inhalt bleibt 3 mm Beschnitt + 4 mm innen */
  .safe { position: absolute; left: 7mm; right: 7mm; top: 7mm; bottom: 7mm; }

  /* Vorderseite */
  .front .glow-a { width: 40mm; height: 30mm; right: -8mm; top: -10mm; background: #ff5fa8; }
  .front .glow-b { width: 40mm; height: 30mm; left: -10mm; bottom: -14mm; background: #5fb0ec; opacity: .4; }
  .front .safe { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .front .logo svg { display: block; width: 58mm; height: auto; }
  .front .claim { margin: 4.2mm 0 0; font-family: "Instrument Serif", serif; font-style: italic; font-size: 11pt; color: #c9c7d6; }
  .front .claim b { font-weight: 400; background: linear-gradient(90deg,#ff5fa8,#b69cff 50%,#5fb0ec); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* Rückseite */
  .back .glow-a { width: 36mm; height: 26mm; left: -12mm; top: -12mm; background: #b69cff; opacity: .35; }
  .back .safe { display: grid; grid-template-columns: 1fr 19mm; gap: 4mm; align-items: center; }
  .back .name { margin: 0; font-family: "Archivo Wide", sans-serif; font-weight: 800; font-size: 11.5pt; letter-spacing: -.02em; line-height: 1.05; }
  .back .role { margin: 1.4mm 0 4.2mm; font-family: "JetBrains Mono", monospace; font-size: 5.6pt; letter-spacing: .14em; text-transform: uppercase; color: #9b99aa; }
  .back .role i { color: #ff5fa8; font-style: normal; }
  .back ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.6mm; font-size: 7pt; }
  .back li { display: flex; align-items: center; gap: 2mm; white-space: nowrap; }
  .back li svg { width: 2.8mm; height: 2.8mm; flex-shrink: 0; fill: none; stroke: #ff5fa8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .back .qr { display: grid; justify-items: center; gap: 1.4mm; }
  .back .qr-box { width: 19mm; height: 19mm; padding: 1.4mm; border-radius: 1.6mm; background: #fff; }
  .back .qr-box svg { display: block; width: 100%; height: 100%; }
  .back .qr span { font-family: "JetBrains Mono", monospace; font-size: 4.6pt; letter-spacing: .08em; text-transform: uppercase; color: #9b99aa; text-align: center; }
  .back .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5.5mm; background: linear-gradient(90deg,#ff5fa8,#b69cff 50%,#5fb0ec); }
</style>
