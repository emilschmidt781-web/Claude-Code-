<!doctype html>
<html lang="de"><head><meta charset="UTF-8" /><meta name="robots" content="noindex" />
<link rel="stylesheet" href="../fonts.css" />
<style>
  html,body{margin:0}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;background:#0b1f3a;display:flex;align-items:center;gap:70px;padding:0 90px;box-sizing:border-box;font-family:Manrope,sans-serif;color:#fff}
  .og::before{content:"";position:absolute;width:760px;height:760px;right:-260px;top:-360px;border-radius:50%;background:radial-gradient(circle,rgba(47,95,214,.55),transparent 70%)}
  .og img{width:290px;position:relative}
  .txt{position:relative}
  .eyebrow{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#9db7ff;font-weight:700;margin:0 0 22px}
  h1{font-family:"Playfair Display",serif;font-weight:500;font-size:64px;line-height:1.05;margin:0}
  h1 em{font-style:italic;color:#9db7ff}
  .rule{width:90px;height:5px;background:#2f5fd6;border-radius:3px;margin:30px 0 24px}
  p{margin:0;font-size:27px;color:rgba(255,255,255,.85);line-height:1.5}
  b{color:#fff}
</style></head>
<body><div class="og">
  <img src="../img/logo-white.png" alt="" />
  <div class="txt">
    <p class="eyebrow">Kitzingen &amp; Mainfranken</p>
    <h1>Die richtigen Menschen.<br /><em>Am richtigen Platz.</em></h1>
    <div class="rule"></div>
    <p>Gewerblich-technisch &amp; kaufmännisch<br /><b>Ricky Wagner · +49 177 6880175</b></p>
  </div>
</div></body></html>
