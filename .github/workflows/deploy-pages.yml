name: Deploy Angel-App, Schneiderei Yasin, Ricky Wagner & Schloss Ebracher Hof to GitHub Pages

on:
  push:
    branches:
      - claude/angel-app-tqz8ao
      - claude/schneiderei-yasin-website-ow4ekq
      - claude/sharp-clarke-r3b1y1
  workflow_dispatch:

# Rechte, die der Deploy auf GitHub Pages benötigt.
permissions:
  contents: read
  pages: write
  id-token: write

# Es soll immer nur ein Deploy gleichzeitig laufen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Eigenständige Einzeldatei bauen
        run: npm run build:single

      # Website der Schneiderei Yasin unter /schneiderei-yasin/ mitveröffentlichen
      - name: Schneiderei-Website hinzufügen
        run: |
          if [ -d schneiderei-yasin ]; then
            mkdir -p dist-pages/schneiderei-yasin
            cp schneiderei-yasin/*.html schneiderei-yasin/*.css schneiderei-yasin/*.js dist-pages/schneiderei-yasin/
          fi

      # Website von Ricky Wagner unter /ricky-wagner/ mitveröffentlichen
      - name: Ricky-Wagner-Website hinzufügen
        run: |
          if [ -d ricky-wagner ]; then
            mkdir -p dist-pages/ricky-wagner
            cp ricky-wagner/*.html ricky-wagner/*.css ricky-wagner/*.js dist-pages/ricky-wagner/
            cp -r ricky-wagner/img dist-pages/ricky-wagner/
            cp -r ricky-wagner/fonts dist-pages/ricky-wagner/
          fi

      # Website des Seniorenheims Schloss Ebracher Hof unter /schloss-ebracher-hof/ mitveröffentlichen
      - name: Schloss-Ebracher-Hof-Website hinzufügen
        run: |
          if [ -d schloss-ebracher-hof ]; then
            mkdir -p dist-pages/schloss-ebracher-hof
            cp schloss-ebracher-hof/*.html schloss-ebracher-hof/*.css schloss-ebracher-hof/*.js dist-pages/schloss-ebracher-hof/
            cp -r schloss-ebracher-hof/fonts dist-pages/schloss-ebracher-hof/
          fi

      - name: GitHub Pages konfigurieren (aktiviert Pages bei Bedarf)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
